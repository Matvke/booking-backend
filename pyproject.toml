[project]
name = "booking-backend"
version = "0.0.1"
description = "Backend для системы бронирования"
authors = [{name = "Matvke"}]
requires-python = ">=3.13"
dependencies = [
    "aiosqlite==0.22.0",
    "alembic==1.17.2",
    "annotated-doc==0.0.4",
    "annotated-types==0.7.0",
    "anyio==4.12.0",
    "asyncpg==0.31.0",
    "click==8.3.1",
    "colorama==0.4.6",
    "fastapi==0.126.0",
    "greenlet==3.3.0",
    "h11==0.16.0",
    "idna==3.11",
    "Mako==1.3.10",
    "MarkupSafe==3.0.3",
    "packaging==25.0",
    "phonenumbers==9.0.21",
    "pydantic==2.12.5",
    "pydantic-extra-types==2.10.6",
    "pydantic-settings==2.12.0",
    "pydantic_core==2.41.5",
    "Pygments==2.19.2",
    "python-dotenv==1.2.1",
    "SQLAlchemy==2.0.45",
    "starlette==0.50.0",
    "typing-inspection==0.4.2",
    "typing_extensions==4.15.0",
    "uvicorn==0.38.0",
]

[project.optional-dependencies]
dev = [
    "iniconfig==2.3.0",
    "pluggy==1.6.0",
    "pre_commit==4.5.1",
    "pytest==9.0.2",
    "pytest-asyncio==1.3.0",
    "ruff==0.14.10",
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
pythonpath = "./src"
testpaths = ["./src/tests"]
asyncio_mode = "auto"
addopts = "-v"
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"

[tool.ruff]
line-length = 88

exclude = [".venv", ".git", "__pycache__", "build", "dist", ".ruff_cache", ".pytest_cache"]

[tool.ruff.lint]
select = ["E", "F", "W"]

[tool.ruff.format]
indent-style = "space"
quote-style = "double"